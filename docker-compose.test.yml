services:
  test-db:
    image: postgres:16-alpine
    container_name: studiobook-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studiobook_test
    ports:
      - "5435:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d studiobook_test"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - studiobook_test_data:/var/lib/postgresql/data

volumes:
  studiobook_test_data:
